name: Collector
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  allchecks:
    name: All checks pass
    runs-on: ubuntu-latest
    # Run this job 8 minutes after the other ones
    # needs config at https://github.com/wiktor-k/pysequoia/settings/environments
    environment: delay
    permissions:
      checks: read
      contents: read
    steps:
      - uses: wechuli/allcheckspassed@v2
